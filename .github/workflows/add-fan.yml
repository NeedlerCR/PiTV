name: Add experimental fan display

on:
  push:
    branches: [experimental]

permissions:
  contents: write

jobs:
  add-fan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fan renderer and command
        shell: python
        run: |
          from pathlib import Path
          import re

          tv = Path('tv_menu.py')
          s = tv.read_text()

          # Add FAN to the external renderer table. The fan is a curses renderer,
          # so it runs inside the existing PiTV display process rather than in SSH.
          old = '''EXTERNAL_CMDS = {
              "FIRE": (["cacafire"], {"CACA_GEOMETRY": "80x40", "CACA_DELAY": "150000"}),
          }'''
          new = '''EXTERNAL_CMDS = {
              "FIRE": (["cacafire"], {"CACA_GEOMETRY": "80x40", "CACA_DELAY": "150000"}),
          }'''
          # FAN is deliberately handled as an internal renderer below.
          if old not in s:
              raise SystemExit('EXTERNAL_CMDS anchor not found')

          old_opts = '''ART_OPTIONS = [
              ("FIRE",          "FIRE",   "FIRE"),
              ("CLOCK + STARS", None,     "CLOCK"),
              ("MATRIX RAIN",   None,     "MATRIX"),
              ("SCREEN MIRROR", "MIRROR", "MIRROR"),
              ("GAMES",         "GAMES",  "GAMES"),
          ]'''
          new_opts = '''ART_OPTIONS = [
              ("FIRE",          "FIRE",   "FIRE"),
              ("CLOCK + STARS", None,     "CLOCK"),
              ("MATRIX RAIN",   None,     "MATRIX"),
              ("SPINNING FAN",  None,     "FAN"),
              ("SCREEN MIRROR", "MIRROR", "MIRROR"),
              ("GAMES",         "GAMES",  "GAMES"),
          ]'''
          if old_opts not in s:
              raise SystemExit('ART_OPTIONS anchor not found')
          s = s.replace(old_opts, new_opts, 1)

          renderer = r'''


def render_fan(stdscr, frame):
    """Animated four-blade desk fan rendered entirely by curses."""
    max_y, max_x = stdscr.getmaxyx()
    cx, cy = max_x // 2, max_y // 2
    radius = max(4, min(max_x // 4, max_y // 2 - 2))

    stdscr.erase()
    angle = (frame * 0.32) % (2 * math.pi)

    # Draw four rounded blades from the hub. Each blade is sampled along a
    # slightly curved path, making the rotation readable even on character cells.
    for blade in range(4):
        a = angle + blade * (math.pi / 2)
        for step in range(1, radius + 1):
            r = step / radius
            spread = 0.16 + 0.34 * r
            for off in (-spread, 0.0, spread):
                x = int(round(cx + math.cos(a + off) * step * 1.55))
                y = int(round(cy + math.sin(a + off) * step * 0.82))
                if 0 <= x < max_x and 0 <= y < max_y:
                    try:
                        stdscr.addch(y, x, '█', curses.color_pair(2) | curses.A_BOLD)
                    except curses.error:
                        pass

    # Hub and small stand/base.
    try:
        stdscr.addch(cy, cx, '●', curses.color_pair(4) | curses.A_BOLD)
        if cy + radius + 1 < max_y:
            stdscr.addstr(cy + radius // 2 + 2, cx - 1, '│', curses.color_pair(3))
            stdscr.addstr(cy + radius // 2 + 3, max(0, cx - 5), '╱────╲', curses.color_pair(3))
    except curses.error:
        pass
'''
          anchor = '\n\ndef render_clock_stars(stdscr, frame):'
          if 'def render_fan(stdscr, frame):' not in s:
              if anchor not in s:
                  raise SystemExit('renderer anchor not found')
              s = s.replace(anchor, renderer + anchor, 1)

          patch = '''# Patch callables into ART_OPTIONS after function definitions
ART_OPTIONS[1] = ("CLOCK + STARS", render_clock_stars, "CLOCK")
ART_OPTIONS[2] = ("MATRIX RAIN",   render_matrix,      "MATRIX")'''
          patch_new = '''# Patch callables into ART_OPTIONS after function definitions
ART_OPTIONS[1] = ("CLOCK + STARS", render_clock_stars, "CLOCK")
ART_OPTIONS[2] = ("MATRIX RAIN",   render_matrix,      "MATRIX")
ART_OPTIONS[3] = ("SPINNING FAN",  render_fan,         "FAN")'''
          if patch not in s:
              raise SystemExit('renderer patch anchor not found')
          s = s.replace(patch, patch_new, 1)

          direct_old = '''                elif art_key in ("CLOCK","MATRIX"):
                    fn = render_clock_stars if art_key=="CLOCK" else render_matrix
                    active_art_type = fn'''
          direct_new = '''                elif art_key in ("CLOCK","MATRIX","FAN"):
                    fn = (render_clock_stars if art_key == "CLOCK" else
                          render_matrix if art_key == "MATRIX" else render_fan)
                    active_art_type = fn'''
          if direct_old not in s:
              raise SystemExit('DIRECT_RUN renderer anchor not found')
          s = s.replace(direct_old, direct_new, 1)

          duration_old = '''                    else:
                        active_art_type = art_type
                        art_stop_time   = time.time()+dur_sec if dur_sec else None
                        current_view    = "ART_RUNNING"'''
          if duration_old not in s:
              raise SystemExit('duration renderer anchor not found')

          tv.write_text(s)

          cli = Path('screen')
          c = cli.read_text()
          c_old = '''  screen matrix [seconds]
'''
          c_new = '''  screen matrix [seconds]
  screen fan [seconds]
'''
          if c_old not in c:
              raise SystemExit('screen usage anchor not found')
          c = c.replace(c_old, c_new, 1)
          c_old = '''    fire|clock|matrix)
        DUR="${2:-INDEFINITE}"
        _send "RUN ${CMD^^} ${DUR}"
        ;;
'''
          c_new = '''    fire|clock|matrix|fan)
        DUR="${2:-INDEFINITE}"
        _send "RUN ${CMD^^} ${DUR}"
        ;;
'''
          if c_old not in c:
              raise SystemExit('screen command anchor not found')
          c = c.replace(c_old, c_new, 1)
          cli.write_text(c)

      - name: Commit fan display
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tv_menu.py screen
          git diff --cached --quiet || git commit -m 'feat: add spinning fan display'
          git push
